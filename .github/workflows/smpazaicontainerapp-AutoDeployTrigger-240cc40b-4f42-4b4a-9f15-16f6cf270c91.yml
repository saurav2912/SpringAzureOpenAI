name: Trigger auto deployment for smpazaicontainerapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev ]
    paths:
    - '**'
    - '.github/workflows/smpazaicontainerapp-AutoDeployTrigger-240cc40b-4f42-4b4a-9f15-16f6cf270c91.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SMPAZAICONTAINERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SMPAZAICONTAINERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SMPAZAICONTAINERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: smpazai.azurecr.io
          registryUsername: ${{ secrets.SMPAZAICONTAINERAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SMPAZAICONTAINERAPP_REGISTRY_PASSWORD }}
          containerAppName: smpazaicontainerapp
          resourceGroup: sauravazai
          imageToBuild: smpazai.azurecr.io/smpazaicontainerapp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


